<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Battlefield - Edición Realista</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020208; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        
        /* HUD Mínimo */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        .top-left { position: absolute; top: 20px; left: 20px; text-align: left; }
        .top-right { position: absolute; top: 20px; right: 20px; text-align: right; }
        
        .price { font-size: 3rem; font-weight: bold; transition: color 0.5s ease; text-shadow: 0 0 30px rgba(0,0,0,0.9); }
        .price.green { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        .price.red { color: #ff3355; text-shadow: 0 0 20px rgba(255, 51, 85, 0.4); }
        .subtext { font-size: 0.9rem; color: #888; }
        
        .sides { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; }
        .bull { color: #00ff88; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
        .bear { color: #ff3355; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 51, 85, 0.5); }
        
        .status-badge { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.85); padding: 10px 30px; border-radius: 30px; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            border: 1px solid #555; transition: all 0.8s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        
        .dominance-bar-container {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 400px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px;
            overflow: hidden;
        }
        .dominance-bar {
            height: 100%; width: 50%; background: #888; transition: width 0.5s ease, background 0.5s ease;
            border-radius: 10px;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="hud">
        <div class="top-left">
            <div class="bull">BULLS</div>
            <div class="price green" id="btcPrice">Cargando...</div>
            <div class="subtext" id="btcChange">--%</div>
        </div>
        <div class="top-right">
            <div class="bear">BEARS</div>
        </div>

        <div class="status-badge" id="statusText">⚔️ EQUILIBRIO</div>
        
        <!-- Barra de dominancia visual -->
        <div class="dominance-bar-container">
            <div class="dominance-bar" id="dominanceBar"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. CONFIGURACIÓN DE ESCENA ---
        const scene = new THREE.Scene();
        // Un cielo oscuro con un ligero tono azulado
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 45);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Iluminación avanzada
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        
        // Luz principal (sol simulado)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(-30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        scene.add(sunLight);

        // Luces de los bandos (iluminan el mapa)
        const greenLight = new THREE.PointLight(0x00ff88, 100, 50);
        greenLight.position.set(-20, 15, 0);
        scene.add(greenLight);
        const redLight = new THREE.PointLight(0xff3355, 100, 50);
        redLight.position.set(20, 15, 0);
        scene.add(redLight);

        // --- 2. TERRENO CON TEXTURA Y RELIEVE ---
        // Usamos un plano más detallado
        const terrainWidth = 60;
        const terrainDepth = 40;
        const segments = 128;
        const geometry = new THREE.PlaneGeometry(terrainWidth, terrainDepth, segments, segments);
        geometry.rotateX(-Math.PI / 2);

        const positionAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        
        // Generamos colinas suaves y naturales
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);
            // Combinación de ondas seno para crear un paisaje orgánico. 
            // El centro (x=0) es un valle (trinchera).
            const y = Math.sin(vertex.x * 0.4) * Math.cos(vertex.z * 0.3) * 2.0 
                    + Math.sin(vertex.x * 0.1 + vertex.z * 0.2) * 1.0
                    - Math.exp(-Math.pow(vertex.x, 2) * 0.05) * 1.5;
            positionAttribute.setY(i, y);
        }
        geometry.computeVertexNormals();

        // Creamos una textura de hierba procedural usando un Canvas
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a3c1a';
            ctx.fillRect(0, 0, 256, 256);
            // Puntos de hierba
            for(let i=0; i<5000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#2a5c2a' : '#1a4a1a';
                ctx.fillRect(Math.random()*256, Math.random()*256, 1, 2 + Math.random()*2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const grassTexture = createGrassTexture();
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(8, 8);

        const material = new THREE.MeshStandardMaterial({
            map: grassTexture,
            roughness: 0.9,
            metalness: 0.0,
            vertexColors: true, // Para el degradado de dominancia
            side: THREE.DoubleSide
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Función para actualizar el color de dominancia en el terreno
        function updateTerrainColors(dominance) {
            const colors = new Float32Array(positionAttribute.count * 3);
            const color = new THREE.Color();
            // La línea de frente se mueve según la dominancia (-1 a 1)
            let frontLineX = dominance * 5; 

            for (let i = 0; i < positionAttribute.count; i++) {
                vertex.fromBufferAttribute(positionAttribute, i);
                const x = vertex.x;
                // Suavizamos la transición
                const t = (x - (frontLineX - 6)) / 12;
                const clampedT = Math.max(0, Math.min(1, t));
                // Mezcla de Verde y Rojo
                const hue = 0.33 - (clampedT * 0.33); 
                color.setHSL(hue, 0.7, 0.12 + (clampedT * 0.25));
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.attributes.color.needsUpdate = true;
        }

        // --- 3. DECORACIÓN DEL MAPA (Árboles y Rocas) ---
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({color: 0x4a3b32, roughness: 0.9});
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.25, 1.5, 6), trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({color: 0x1a5a1a, roughness: 0.8});
            const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.8, 6), leafMat);
            leaf1.position.y = 1.8;
            leaf1.castShadow = true;
            group.add(leaf1);

            const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.2, 6), leafMat);
            leaf2.position.y = 2.8;
            leaf2.castShadow = true;
            group.add(leaf2);

            const y = Math.sin(x * 0.4) * Math.cos(z * 0.3) * 2.0 + Math.sin(x * 0.1 + z * 0.2) * 1.0;
            group.position.set(x, y, z);
            return group;
        }

        function createRock(x, z, size) {
            const mat = new THREE.MeshStandardMaterial({color: 0x556677, roughness: 0.9});
            const geo = new THREE.DodecahedronGeometry(size);
            const mesh = new THREE.Mesh(geo, mat);
            const y = Math.sin(x * 0.4) * Math.cos(z * 0.3) * 2.0 + Math.sin(x * 0.1 + z * 0.2) * 1.0;
            mesh.position.set(x, y + size/2, z);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Poblar el mapa
        const trees = [];
        const rocks = [];

        for(let i=0; i<100; i++) {
            let x = (Math.random() - 0.5) * 50;
            let z = (Math.random() - 0.5) * 30;
            if(Math.abs(x) < 8 || Math.abs(z) < 3) continue; // Zona de batalla libre
            if(Math.abs(x) > 25) continue; // Zona de bases libre
            
            const tree = createTree(x, z);
            scene.add(tree);
            trees.push(tree);
        }

        for(let i=0; i<40; i++) {
            let x = (Math.random() - 0.5) * 50;
            let z = (Math.random() - 0.5) * 30;
            if(Math.abs(x) < 8 || Math.abs(x) > 25) continue;
            const rock = createRock(x, z, 0.3 + Math.random()*0.5);
            scene.add(rock);
            rocks.push(rock);
        }

        // --- 4. SOLDADOS 3D ESTILIZADOS (NUEVO DISEÑO) ---
        // En lugar de sprites, usamos geometría 3D para que se vean más reales y tengan volumen.
        function create3DSoldier(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xdcb38a });

            // Cuerpo (Torso)
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.8, 6), mat);
            torso.position.y = 0.9;
            torso.castShadow = true;
            group.add(torso);

            // Cabeza (Casco)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), darkMat);
            head.position.y = 1.4;
            head.castShadow = true;
            group.add(head);
            
            // Visor del casco
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.3), new THREE.MeshStandardMaterial({color: 0x00aaff, emissive: 0x00aaff, emissiveIntensity: 0.5}));
            visor.position.set(0, 1.3, 0.25);
            group.add(visor);

            // Brazos
            const armMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.6, 4);
            
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.4, 0.9, 0);
            armL.rotation.z = 0.2;
            armL.castShadow = true;
            group.add(armL);

            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.4, 0.9, 0);
            armR.rotation.z = -0.2;
            armR.castShadow = true;
            group.add(armR);

            // Piernas
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const legGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 4);
            
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.15, 0.3, 0);
            legL.castShadow = true;
            group.add(legL);

            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.15, 0.3, 0);
            legR.castShadow = true;
            group.add(legR);

            // Rifle
            const rifleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.5, roughness: 0.4 });
            const rifle = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.08), rifleMat);
            rifle.position.set(0.5, 0.9, 0);
            rifle.rotation.z = -0.1;
            group.add(rifle);

            return group;
        }

        class Soldier {
            constructor(x, z, team) {
                this.team = team;
                this.alive = true;
                this.hp = 100;
                
                const color = team === 'green' ? 0x00ff88 : 0xff3355;
                this.mesh = create3DSoldier(color);
                const y = Math.sin(x * 0.4) * Math.cos(z * 0.3) * 2.0 + Math.sin(x * 0.1 + z * 0.2) * 1.0;
                this.mesh.position.set(x, y, z);
                
                // Rotar el soldado hacia el frente
                if(team === 'green') this.mesh.rotation.y = 0;
                else this.mesh.rotation.y = Math.PI;

                scene.add(this.mesh);
                this.speed = 0.03 + Math.random() * 0.02;
                
                // Límite de movimiento en Z (NUNCA se salen del mapa)
                this.zBoundary = 14; 
                this.initialZ = z;
            }

            update(pushStrength, time) {
                if(!this.alive) return;

                // Movimiento frontal (solo en X)
                let moveForce = this.speed + (pushStrength * 0.03);
                if(this.team === 'green') this.mesh.position.x += moveForce;
                else this.mesh.position.x -= moveForce;

                // Movimiento lateral limitado (para que no se salgan por los lados)
                // El soldado se mueve en Z, pero rebota si llega al borde del mapa (14 o -14)
                let zMove = Math.sin(time * 0.001 + this.initialZ * 10) * 0.02;
                this.mesh.position.z += zMove;
                
                // CORRECCIÓN: Si el soldado está a punto de salirse del mapa, lo empujamos hacia adentro
                if (this.mesh.position.z > this.zBoundary) this.mesh.position.z = this.zBoundary - 0.1;
                if (this.mesh.position.z < -this.zBoundary) this.mesh.position.z = -this.zBoundary + 0.1;

                // Límites de la trinchera (no pasan del centro)
                if(this.mesh.position.x > 4 && this.team === 'green') this.mesh.position.x = 4;
                if(this.mesh.position.x < -4 && this.team === 'red') this.mesh.position.x = -4;
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                if(this.hp <= 0) {
                    this.alive = false;
                    scene.remove(this.mesh);
                    createExplosion(this.mesh.position.x, this.mesh.position.y + 1, this.mesh.position.z, this.team);
                    // Reaparecer en la retaguardia
                    setTimeout(() => this.respawn(), 1500 + Math.random() * 1000);
                }
            }

            respawn() {
                this.alive = true;
                this.hp = 100;
                const z = (Math.random() - 0.5) * 20; // Dentro de los límites del mapa
                const y = Math.sin(this.mesh.position.x * 0.4) * Math.cos(z * 0.3) * 2.0 + Math.sin(this.mesh.position.x * 0.1 + z * 0.2) * 1.0;
                
                if(this.team === 'green') {
                    this.mesh.position.set(-12 - Math.random()*2, y, z);
                } else {
                    this.mesh.position.set(12 + Math.random()*2, y, z);
                }
                scene.add(this.mesh);
                this.initialZ = z;
            }
        }

        // --- 5. EXPLOSIONES MEJORADAS ---
        const explosions = [];
        function createExplosion(x, y, z, teamColor) {
            const count = 100;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const velocities = [];
            const baseColor = teamColor === 'green' ? [0, 1, 0.5] : [1, 0.2, 0.3];

            for(let i=0; i<count; i++) {
                positions[i*3] = x + (Math.random()-0.5)*1.5;
                positions[i*3+1] = y;
                positions[i*3+2] = z + (Math.random()-0.5)*1.5;
                
                const r = Math.random();
                if(r < 0.6) { colors[i*3] = 1; colors[i*3+1] = 0.6; colors[i*3+2] = 0; } // Fuego
                else if(r < 0.8) { colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; } // Humo
                else { colors[i*3] = baseColor[0]; colors[i*3+1] = baseColor[1]; colors[i*3+2] = baseColor[2]; } // Bando

                velocities.push({
                    x: (Math.random() - 0.5) * 4,
                    y: Math.random() * 5 + 2,
                    z: (Math.random() - 0.5) * 4
                });
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            explosions.push({ mesh: points, velocities: velocities, life: 1.0, decay: 0.015 });
        }

        // --- 6. EJÉRCITOS ---
        const greenArmy = [];
        const redArmy = [];
        const armyCount = 60; 

        for(let i=0; i<armyCount; i++) {
            const z = (Math.random() - 0.5) * 20; // Controlado para que no salga
            greenArmy.push(new Soldier(-12 - Math.random()*2, z, 'green'));
            redArmy.push(new Soldier(12 + Math.random()*2, z, 'red'));
        }

        // --- 7. PRECIO REAL ---
        let currentPrice = 64000;
        let dominance = 0;
        const priceElement = document.getElementById('btcPrice');
        const changeElement = document.getElementById('btcChange');
        const statusElement = document.getElementById('statusText');
        const dominanceBar = document.getElementById('dominanceBar');

        async function fetchBTCPrice() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
                const data = await response.json();
                currentPrice = parseFloat(data.lastPrice);
                const change = parseFloat(data.priceChangePercent);

                priceElement.textContent = `$${currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                priceElement.className = `price ${change > 0 ? 'green' : 'red'}`;
                changeElement.textContent = `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;

                // Dominancia (-1 a 1)
                dominance = Math.max(-1, Math.min(1, change / 2)); 
                
                // Actualizar terreno
                updateTerrainColors(dominance);

                // Actualizar barra de dominancia (visual)
                const barPercent = 50 + (dominance * 50);
                dominanceBar.style.width = `${Math.max(0, Math.min(100, barPercent))}%`;
                if(dominance > 0.1) {
                    dominanceBar.style.background = '#00ff88';
                    dominanceBar.style.boxShadow = '0 0 10px #00ff88';
                } else if (dominance < -0.1) {
                    dominanceBar.style.background = '#ff3355';
                    dominanceBar.style.boxShadow = '0 0 10px #ff3355';
                } else {
                    dominanceBar.style.background = '#888';
                    dominanceBar.style.boxShadow = 'none';
                }

                // Estado
                if(dominance > 0.3) {
                    statusElement.innerHTML = '🐂 AVANCE BULL';
                    statusElement.style.color = '#00ff88';
                    statusElement.style.borderColor = '#00ff88';
                } else if (dominance < -0.3) {
                    statusElement.innerHTML = '🐻 AVANCE BEAR';
                    statusElement.style.color = '#ff3355';
                    statusElement.style.borderColor = '#ff3355';
                } else {
                    statusElement.innerHTML = '⚔️ EQUILIBRIO';
                    statusElement.style.color = '#aaa';
                    statusElement.style.borderColor = '#555';
                }

            } catch (error) {
                console.error("API Error:", error);
            }
        }
        fetchBTCPrice();
        setInterval(fetchBTCPrice, 3000);

        // --- 8. COMBATE ---
        function checkCollisions() {
            const limit = 1.8;
            for(let g of greenArmy) {
                if(!g.alive) continue;
                for(let r of redArmy) {
                    if(!r.alive) continue;
                    const dx = g.mesh.position.x - r.mesh.position.x;
                    const dz = g.mesh.position.z - r.mesh.position.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if(dist < limit) {
                        g.takeDamage(25);
                        r.takeDamage(25);
                        // Rebote
                        const pushX = dx / dist;
                        const pushZ = dz / dist;
                        g.mesh.position.x += pushX * 0.5;
                        r.mesh.position.x -= pushX * 0.5;
                        g.mesh.position.z += pushZ * 0.5;
                        r.mesh.position.z -= pushZ * 0.5;
                    }
                }
            }
        }

        // --- 9. BUCLE PRINCIPAL ---
        let time = 0;
        let rainPositions;
        
        // Crear lluvia (partículas)
        const rainCount = 2000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount*3; i+=3) {
            rainPos[i] = (Math.random()-0.5)*100;
            rainPos[i+1] = Math.random()*60;
            rainPos[i+2] = (Math.random()-0.5)*100;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({color: 0x88aaff, size: 0.1, transparent: true, opacity: 0.2});
        const rain = new THREE.Points(rainGeo, rainMat);
        scene.add(rain);

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Lluvia
            const rPos = rain.geometry.attributes.position.array;
            for(let i=1; i<rPos.length; i+=3) {
                rPos[i] -= 0.8;
                if(rPos[i] < -10) rPos[i] = 60;
            }
            rain.geometry.attributes.position.needsUpdate = true;

            // Actualizar soldados (solo avanzan y con límite Z)
            const pushStrength = dominance * 0.6;
            greenArmy.forEach(g => g.update(pushStrength, time));
            redArmy.forEach(r => r.update(pushStrength, time));

            // Peleas
            checkCollisions();

            // Explosiones
            for(let i=explosions.length-1; i>=0; i--) {
                const exp = explosions[i];
                exp.life -= exp.decay;
                const pos = exp.mesh.geometry.attributes.position.array;
                for(let j=0; j<pos.length; j+=3) {
                    pos[j] += exp.velocities[j/3].x * 0.2;
                    pos[j+1] += exp.velocities[j/3].y * 0.2;
                    pos[j+2] += exp.velocities[j/3].z * 0.2;
                    exp.velocities[j/3].y -= 0.05;
                }
                exp.mesh.geometry.attributes.position.needsUpdate = true;
                exp.mesh.material.opacity = exp.life;
                if(exp.life <= 0) {
                    scene.remove(exp.mesh);
                    explosions.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Inicialización
        updateTerrainColors(0);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
