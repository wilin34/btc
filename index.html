<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚔️ BATALLA BTC - League of Legends ⚔️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            background: #0a0e17;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Orbitron', sans-serif;
            padding: 12px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: linear-gradient(145deg, #111927, #0d1420);
            border-radius: 30px;
            padding: 18px 18px 22px;
            border: 2px solid rgba(255, 215, 0, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), inset 0 0 60px rgba(255, 215, 0, 0.02);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #f7931a22, transparent, #f7931a22, transparent);
            border-radius: 32px;
            z-index: -1;
            filter: blur(3px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            padding: 0 6px;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 16px 5px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .price-label {
            color: #8899bb;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f7931a, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(247, 147, 26, 0.2);
        }

        .price-change {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-change.positive {
            color: #4caf50;
            border-color: #4caf5044;
        }
        .price-change.negative {
            color: #f44336;
            border-color: #f4433644;
        }

        .last-update {
            font-size: 0.6rem;
            color: #5a6a82;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .arena-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.06);
            background: #0d1420;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9), 0 10px 40px rgba(0, 0, 0, 0.6);
            margin: 4px 0 12px;
        }

        #battleCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 960 / 540;
            background: #0d1420;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px;
            padding: 0 4px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex: 1;
            min-width: 70px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .stat-item .label {
            font-size: 0.45rem;
            text-transform: uppercase;
            color: #5a6a82;
            letter-spacing: 2px;
        }

        .stat-item .value {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 1px;
            color: #c8d8e8;
        }

        .value.green {
            color: #4caf50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
        }
        .value.red {
            color: #f44336;
            text-shadow: 0 0 20px rgba(244, 67, 54, 0.2);
        }
        .value.neutral {
            color: #ffb347;
            text-shadow: 0 0 20px rgba(255, 180, 70, 0.15);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px;
        }

        .refresh-btn {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.12);
            color: #c8d8e8;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .refresh-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.25);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.04);
        }

        .power-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 14px 3px 10px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .power-label {
            font-size: 0.65rem;
            color: #8899bb;
            font-weight: 700;
        }

        .power-bar-bg {
            width: 130px;
            height: 7px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .power-bar-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #f44336, #ffb347, #4caf50);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 600px) {
            .price-value {
                font-size: 1.2rem;
            }
            .stat-item .value {
                font-size: 0.7rem;
            }
            .power-bar-bg {
                width: 70px;
            }
            .container {
                padding: 10px 10px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="price-box">
                <span class="price-label">⚡ BTC</span>
                <span class="price-value" id="priceDisplay">$—</span>
                <span class="price-change" id="changeDisplay">—</span>
            </div>
            <div class="last-update" id="updateTime">⏱️ —</div>
        </div>

        <div class="arena-wrapper">
            <canvas id="battleCanvas" width="960" height="540"></canvas>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="label">Precio Anterior</div>
                <div class="value" id="prevPrice">—</div>
            </div>
            <div class="stat-item">
                <div class="label">Cambio %</div>
                <div class="value" id="percentChange">—</div>
            </div>
            <div class="stat-item">
                <div class="label">Dominio</div>
                <div class="value" id="powerStatus">⚖️</div>
            </div>
            <div class="stat-item">
                <div class="label">Victoria</div>
                <div class="value" id="victoryStatus">⚔️</div>
            </div>
        </div>

        <div class="footer">
            <button class="refresh-btn" id="refreshBtn">🔄 ACTUALIZAR</button>
            <div class="power-indicator">
                <span class="power-label" style="color:#f44336;">🐻</span>
                <div class="power-bar-bg">
                    <div class="power-bar-fill" id="powerBarFill" style="width:50%;"></div>
                </div>
                <span class="power-label" style="color:#4caf50;">🐂</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // CONFIGURACIÓN
            // ============================================================
            const REFRESH_MS = 5000;
            const canvas = document.getElementById('battleCanvas');
            const ctx = canvas.getContext('2d');
            const W = 960,
                H = 540;

            // DOM
            const priceDisplay = document.getElementById('priceDisplay');
            const changeDisplay = document.getElementById('changeDisplay');
            const updateTime = document.getElementById('updateTime');
            const prevPriceEl = document.getElementById('prevPrice');
            const percentChangeEl = document.getElementById('percentChange');
            const powerStatusEl = document.getElementById('powerStatus');
            const victoryStatusEl = document.getElementById('victoryStatus');
            const powerBarFill = document.getElementById('powerBarFill');
            const refreshBtn = document.getElementById('refreshBtn');

            // ============================================================
            // ESTADO
            // ============================================================
            let currentPrice = 65000; // Precio inicial por defecto
            let lastPrice = null;
            let force = 0;
            let previousForce = 0;
            let gameTime = 0;
            let bullWins = 0;
            let bearWins = 0;

            // ============================================================
            // FUENTES DE PRECIO (múltiples para evitar bloqueos)
            // ============================================================
            const PRICE_SOURCES = [
                'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd',
                'https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',
                'https://min-api.cryptocompare.com/data/price?fsym=BTC&tsyms=USD'
            ];

            let priceSourceIndex = 0;

            async function fetchPrice() {
                for (let attempt = 0; attempt < PRICE_SOURCES.length; attempt++) {
                    try {
                        const url = PRICE_SOURCES[priceSourceIndex % PRICE_SOURCES.length];
                        const resp = await fetch(url, {
                            headers: {
                                'Accept': 'application/json'
                            }
                        });
                        if (!resp.ok) throw new Error('HTTP error');
                        const data = await resp.json();

                        let price = null;
                        // Detectar formato
                        if (data.bitcoin && data.bitcoin.usd) {
                            price = data.bitcoin.usd;
                        } else if (data.price) {
                            price = parseFloat(data.price);
                        } else if (data.symbol === 'BTCUSDT' && data.price) {
                            price = parseFloat(data.price);
                        } else {
                            // Intentar extraer de cualquier campo
                            const keys = Object.keys(data);
                            for (const key of keys) {
                                if (typeof data[key] === 'number' && data[key] > 1000) {
                                    price = data[key];
                                    break;
                                }
                            }
                        }

                        if (price && typeof price === 'number' && price > 1000) {
                            const previous = lastPrice;
                            lastPrice = price;
                            currentPrice = price;
                            updateForce(price, previous);
                            updateUI(price, previous);
                            return price;
                        }
                        priceSourceIndex++;
                    } catch (e) {
                        console.warn('Error en fuente de precio:', e);
                        priceSourceIndex++;
                    }
                }

                // Si falla todo, usar precio simulado con pequeña variación
                const variation = (Math.random() - 0.5) * 200;
                const simulatedPrice = currentPrice + variation;
                if (simulatedPrice > 1000) {
                    const previous = lastPrice;
                    lastPrice = simulatedPrice;
                    currentPrice = simulatedPrice;
                    updateForce(simulatedPrice, previous);
                    updateUI(simulatedPrice, previous);
                    return simulatedPrice;
                }
                return null;
            }

            // ============================================================
            // FUERZA Y UI
            // ============================================================
            function updateForce(price, previous) {
                if (previous === null || price === null) { force = 0; return; }
                const diff = price - previous;
                const percent = (diff / previous) * 100;
                const clamped = Math.min(Math.max(percent, -15), 15);
                force = clamped / 15;
                force = force * 0.2 + previousForce * 0.8;
                previousForce = force;
            }

            function updateUI(price, previous) {
                if (!price) return;
                const formatted = '$' + Number(price).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                priceDisplay.textContent = formatted;

                let changeText = '—',
                    changeClass = '',
                    percentText = '—',
                    sign = 0;
                if (previous !== null) {
                    const diff = price - previous;
                    const percent = (diff / previous) * 100;
                    sign = Math.sign(diff);
                    changeText = (sign > 0 ? '+' : '') + diff.toFixed(2) + ' USD';
                    percentText = (sign > 0 ? '+' : '') + percent.toFixed(2) + '%';
                    changeClass = sign > 0 ? 'positive' : sign < 0 ? 'negative' : '';
                }
                changeDisplay.textContent = changeText;
                changeDisplay.className = 'price-change ' + changeClass;
                percentChangeEl.textContent = percentText;
                percentChangeEl.className = 'value ' + (sign > 0 ? 'green' : sign < 0 ? 'red' : 'neutral');
                prevPriceEl.textContent = previous !== null ? '$' + Number(previous).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2 }) : '—';

                const powerPercent = 50 + force * 50;
                powerBarFill.style.width = Math.min(Math.max(powerPercent, 5), 95) + '%';

                let statusText = '⚖️ EQUILIBRIO';
                let statusClass = 'neutral';
                if (force > 0.2) { statusText = '🐂 TOROS DOMINAN';
                    statusClass = 'green'; } else if (force < -0.2) { statusText = '🐻 OSOS DOMINAN';
                    statusClass = 'red'; }
                powerStatusEl.textContent = statusText;
                powerStatusEl.className = 'value ' + statusClass;

                const now = new Date();
                updateTime.textContent = '⏱️ ' + now.toLocaleTimeString();
            }

            // ============================================================
            // EJÉRCITOS Y BATALLA
            // ============================================================
            let bullArmy = [];
            let bearArmy = [];
            let projectiles = [];
            let particles = [];
            let shakeIntensity = 0;
            let shakeX = 0,
                shakeY = 0;

            function createArmies() {
                bullArmy = [];
                bearArmy = [];

                // Toros - 20 unidades en formación (5x4)
                for (let i = 0; i < 20; i++) {
                    const row = Math.floor(i / 5);
                    const col = i % 5;
                    bullArmy.push({
                        x: 70 + col * 30 + row * 4,
                        y: 160 + row * 36 + Math.sin(i * 1.3) * 5,
                        baseX: 70 + col * 30 + row * 4,
                        baseY: 160 + row * 36 + Math.sin(i * 1.3) * 5,
                        health: 100,
                        maxHealth: 100,
                        state: 'idle',
                        attackCooldown: 0,
                        size: 0.6 + Math.random() * 0.2,
                        phase: Math.random() * 100,
                        alive: true,
                        row: row,
                        col: col
                    });
                }

                // Osos - 20 unidades
                for (let i = 0; i < 20; i++) {
                    const row = Math.floor(i / 5);
                    const col = i % 5;
                    bearArmy.push({
                        x: 890 - col * 30 - row * 4,
                        y: 160 + row * 36 + Math.sin(i * 1.3 + 10) * 5,
                        baseX: 890 - col * 30 - row * 4,
                        baseY: 160 + row * 36 + Math.sin(i * 1.3 + 10) * 5,
                        health: 100,
                        maxHealth: 100,
                        state: 'idle',
                        attackCooldown: 0,
                        size: 0.6 + Math.random() * 0.2,
                        phase: Math.random() * 100,
                        alive: true,
                        row: row,
                        col: col
                    });
                }
            }
            createArmies();

            // ============================================================
            // PROYECTILES Y EXPLOSIONES
            // ============================================================
            function spawnProjectile(fromX, fromY, toX, toY, isBull) {
                const dx = toX - fromX;
                const dy = toY - fromY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const speed = 5 + Math.random() * 1.5;
                const vx = (dx / dist) * speed;
                const vy = (dy / dist) * speed - 1;
                const color = isBull ? '#ff6d00' : '#2979ff';
                const size = 12 + Math.random() * 6;
                projectiles.push({
                    x: fromX,
                    y: fromY - 15,
                    vx: vx,
                    vy: vy,
                    radius: size,
                    color: color,
                    isBull: isBull,
                    trail: [],
                    life: 1,
                    gravity: 0.05,
                    glow: isBull ? '#ff9800' : '#64b5f6'
                });
            }

            function createExplosion(x, y, color, count = 70, big = false) {
                const mult = big ? 1.8 : 1;
                const colors = [color, '#ffffff', color, '#ffcc80', '#90caf9'];
                for (let i = 0; i < count * mult; i++) {
                    const angle = Math.random() * 2 * Math.PI;
                    const speed = 1 + Math.random() * 9 * mult;
                    const size = 2 + Math.random() * 14 * mult;
                    const c = colors[Math.floor(Math.random() * colors.length)];
                    particles.push({
                        x: x + (Math.random() - 0.5) * 10,
                        y: y + (Math.random() - 0.5) * 10,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1.5,
                        radius: size,
                        color: c,
                        life: 1,
                        decay: 0.005 + Math.random() * 0.025,
                        gravity: 0.05,
                        sparkle: Math.random() > 0.7
                    });
                }
                for (let i = 0; i < 30 * mult; i++) {
                    particles.push({
                        x: x + (Math.random() - 0.5) * 30,
                        y: y + (Math.random() - 0.5) * 30,
                        vx: (Math.random() - 0.5) * 5,
                        vy: -3 - Math.random() * 6,
                        radius: 1 + Math.random() * 4,
                        color: '#ffffff',
                        life: 1,
                        decay: 0.03 + Math.random() * 0.06,
                        gravity: -0.02,
                        sparkle: true
                    });
                }
                shakeIntensity = big ? 18 : 10;
            }

            // ============================================================
            // ACTUALIZAR BATALLA
            // ============================================================
            function updateBattle() {
                gameTime++;
                const attackThreshold = 0.1;
                const isBullDominant = force > attackThreshold;
                const isBearDominant = force < -attackThreshold;

                // Toros
                for (const unit of bullArmy) {
                    if (!unit.alive) continue;
                    unit.attackCooldown = Math.max(0, unit.attackCooldown - 1);
                    const advance = force * 30;
                    unit.x = unit.baseX + advance + Math.sin(gameTime * 0.02 + unit.phase) * 3;
                    unit.y = unit.baseY + Math.sin(gameTime * 0.025 + unit.phase * 0.7) * 2;

                    if (isBullDominant && unit.attackCooldown === 0 && Math.random() < 0.05 + Math.abs(force) * 0.1) {
                        const targets = bearArmy.filter(b => b.alive);
                        if (targets.length > 0) {
                            const target = targets[Math.floor(Math.random() * targets.length)];
                            spawnProjectile(unit.x + 25, unit.y - 10, target.x - 15, target.y - 15, true);
                            unit.state = 'attack';
                            unit.attackCooldown = 35 + Math.random() * 25;
                            setTimeout(() => { if (unit) unit.state = 'idle'; }, 250);
                        }
                    }
                }

                // Osos
                for (const unit of bearArmy) {
                    if (!unit.alive) continue;
                    unit.attackCooldown = Math.max(0, unit.attackCooldown - 1);
                    const advance = force * 30;
                    unit.x = unit.baseX + advance + Math.sin(gameTime * 0.02 + unit.phase + 2) * 3;
                    unit.y = unit.baseY + Math.sin(gameTime * 0.025 + unit.phase * 0.7 + 1) * 2;

                    if (isBearDominant && unit.attackCooldown === 0 && Math.random() < 0.05 + Math.abs(force) * 0.1) {
                        const targets = bullArmy.filter(b => b.alive);
                        if (targets.length > 0) {
                            const target = targets[Math.floor(Math.random() * targets.length)];
                            spawnProjectile(unit.x - 25, unit.y - 10, target.x + 15, target.y - 15, false);
                            unit.state = 'attack';
                            unit.attackCooldown = 35 + Math.random() * 25;
                            setTimeout(() => { if (unit) unit.state = 'idle'; }, 250);
                        }
                    }
                }

                // Proyectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.trail.push({ x: p.x, y: p.y });
                    if (p.trail.length > 14) p.trail.shift();

                    const enemyArmy = p.isBull ? bearArmy : bullArmy;
                    let hit = false;
                    for (const unit of enemyArmy) {
                        if (!unit.alive) continue;
                        const dx = p.x - unit.x;
                        const dy = p.y - unit.y;
                        if (Math.sqrt(dx * dx + dy * dy) < 32) {
                            createExplosion(p.x, p.y, p.isBull ? '#ff6d00' : '#2979ff', 60, true);
                            unit.health -= 18 + Math.random() * 15;
                            unit.state = 'hit';
                            setTimeout(() => { if (unit) unit.state = 'idle'; }, 350);
                            if (unit.health <= 0) {
                                unit.alive = false;
                                createExplosion(unit.x, unit.y, '#ff9800', 100, true);
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit || p.x < -50 || p.x > W + 50 || p.y > H + 50) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                }

                // Partículas
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity || 0.05;
                    p.life -= p.decay || 0.01;
                    if (p.life <= 0 || p.y > H + 30) {
                        particles.splice(i, 1);
                    }
                }

                // Shake
                if (shakeIntensity > 0) {
                    shakeX = (Math.random() - 0.5) * shakeIntensity * 1.2;
                    shakeY = (Math.random() - 0.5) * shakeIntensity * 1.2;
                    shakeIntensity *= 0.9;
                    if (shakeIntensity < 0.3) shakeIntensity = 0;
                } else {
                    shakeX = 0;
                    shakeY = 0;
                }

                // Victorias
                const bullAlive = bullArmy.filter(u => u.alive).length;
                const bearAlive = bearArmy.filter(u => u.alive).length;

                if (bullAlive === 0 || bearAlive === 0) {
                    if (bullAlive === 0) {
                        bearWins++;
                        victoryStatusEl.textContent = '🐻 OSO VICTORIA';
                        victoryStatusEl.className = 'value red';
                    } else {
                        bullWins++;
                        victoryStatusEl.textContent = '🐂 TORO VICTORIA';
                        victoryStatusEl.className = 'value green';
                    }
                    createExplosion(W / 2, H / 2, '#ff9800', 150, true);
                    setTimeout(() => {
                        createArmies();
                        projectiles = [];
                        particles = [];
                    }, 1800);
                }

                // Ataques automáticos
                if (Math.abs(force) > 0.05 && gameTime % Math.max(40, 80 - Math.abs(force) * 50) === 0) {
                    const bullUnits = bullArmy.filter(u => u.alive);
                    const bearUnits = bearArmy.filter(u => u.alive);
                    if (bullUnits.length > 0 && bearUnits.length > 0) {
                        if (force > 0) {
                            const from = bullUnits[Math.floor(Math.random() * bullUnits.length)];
                            const to = bearUnits[Math.floor(Math.random() * bearUnits.length)];
                            spawnProjectile(from.x + 30, from.y - 20, to.x - 20, to.y - 20, true);
                        } else {
                            const from = bearUnits[Math.floor(Math.random() * bearUnits.length)];
                            const to = bullUnits[Math.floor(Math.random() * bullUnits.length)];
                            spawnProjectile(from.x - 30, from.y - 20, to.x + 20, to.y - 20, false);
                        }
                    }
                }
            }

            // ============================================================
            // DIBUJAR MAPA - Estilo League of Legends
            // ============================================================
            function drawMap() {
                // Fondo base
                ctx.fillStyle = '#0a0e1a';
                ctx.fillRect(0, 0, W, H);

                // Cielo estrellado
                for (let i = 0; i < 100; i++) {
                    const x = (i * 137 + 50) % W;
                    const y = (i * 97 + 30) % (H * 0.45);
                    const size = 0.5 + (i % 3) * 0.5;
                    const alpha = 0.2 + Math.sin(gameTime * 0.01 + i) * 0.15;
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fillRect(x, y, size, size);
                }

                // Río central (estilo LoL)
                const midX = W / 2 + force * 40;

                // Agua del río (curvo)
                ctx.save();
                ctx.shadowColor = 'rgba(0,150,255,0.1)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.moveTo(midX - 30, H - 150);
                ctx.quadraticCurveTo(midX + 80, H / 2 + 30, midX - 20, 130);
                ctx.quadraticCurveTo(midX - 60, 100, midX - 10, 80);
                ctx.lineTo(midX + 10, 80);
                ctx.quadraticCurveTo(midX - 40, 100, midX + 30, 130);
                ctx.quadraticCurveTo(midX + 100, H / 2 + 30, midX + 20, H - 150);
                ctx.closePath();
                const waterGrad = ctx.createLinearGradient(0, 0, 0, H);
                waterGrad.addColorStop(0, 'rgba(20,80,150,0.25)');
                waterGrad.addColorStop(0.5, 'rgba(30,120,200,0.35)');
                waterGrad.addColorStop(1, 'rgba(20,80,150,0.25)');
                ctx.fillStyle = waterGrad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();

                // Suelo - mitades con textura
                // Toro (verde)
                ctx.fillStyle = '#1a4a2a';
                ctx.beginPath();
                ctx.moveTo(0, H - 110);
                ctx.lineTo(midX - 30, H - 150);
                ctx.quadraticCurveTo(midX - 40, H / 2 + 30, midX - 20, 130);
                ctx.quadraticCurveTo(midX - 60, 100, midX - 10, 80);
                ctx.lineTo(0, 80);
                ctx.lineTo(0, H);
                ctx.fill();

                // Textura pasto toro
                ctx.fillStyle = '#2a6a3a';
                for (let i = 0; i < 40; i++) {
                    let x = Math.random() * (midX - 30);
                    let y = 80 + Math.random() * (H - 190);
                    ctx.fillRect(x, y, 2, 4 + Math.random() * 10);
                }

                // Oso (rojo)
                ctx.fillStyle = '#5a1a1a';
                ctx.beginPath();
                ctx.moveTo(midX + 30, H - 150);
                ctx.lineTo(W, H - 110);
                ctx.lineTo(W, H);
                ctx.lineTo(midX + 30, H - 150);
                ctx.quadraticCurveTo(midX + 100, H / 2 + 30, midX + 30, 130);
                ctx.quadraticCurveTo(midX - 40, 100, midX + 10, 80);
                ctx.quadraticCurveTo(midX - 60, 100, midX + 30, 130);
                ctx.fill();

                ctx.fillStyle = '#7a2a2a';
                for (let i = 0; i < 40; i++) {
                    let x = midX + 30 + Math.random() * (W - midX - 30);
                    let y = 80 + Math.random() * (H - 190);
                    ctx.fillRect(x, y, 2, 4 + Math.random() * 10);
                }

                // Base/Torre del equipo (Nexus)
                // Toro (izquierda)
                ctx.shadowColor = '#4caf50';
                ctx.shadowBlur = 40;
                ctx.fillStyle = '#2a6a3a';
                ctx.beginPath();
                ctx.arc(45, H - 60, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4caf50';
                ctx.font = '32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🏰', 45, H - 60);
                ctx.shadowBlur = 0;

                // Oso (derecha)
                ctx.shadowColor = '#f44336';
                ctx.shadowBlur = 40;
                ctx.fillStyle = '#7a2a2a';
                ctx.beginPath();
                ctx.arc(W - 45, H - 60, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f44336';
                ctx.font = '32px sans-serif';
                ctx.fillText('🏰', W - 45, H - 60);
                ctx.shadowBlur = 0;

                // Torres (estructuras defensivas)
                const towerPositions = [
                    [150, 200],
                    [250, 300],
                    [150, 400],
                    [W - 150, 200],
                    [W - 250, 300],
                    [W - 150, 400]
                ];
                for (let i = 0; i < towerPositions.length; i++) {
                    const [tx, ty] = towerPositions[i];
                    const isBull = i < 3;
                    ctx.shadowColor = isBull ? '#4caf50' : '#f44336';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = isBull ? '#2a4a2a' : '#4a2a2a';
                    ctx.fillRect(tx - 10, ty - 25, 20, 35);
                    ctx.fillStyle = isBull ? '#4caf50' : '#f44336';
                    ctx.fillRect(tx - 6, ty - 30, 12, 8);
                    ctx.shadowBlur = 0;
                    // Luz de torreta
                    ctx.fillStyle = isBull ? 'rgba(76,175,80,0.1)' : 'rgba(244,67,54,0.1)';
                    ctx.beginPath();
                    ctx.arc(tx, ty + 10, 40, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Línea de fuego central
                ctx.shadowColor = '#ff9800';
                ctx.shadowBlur = 40;
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(midX, 80);
                ctx.quadraticCurveTo(midX + 40, H / 2, midX, H - 150);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;

                // Llamas
                for (let i = 0; i < 10; i++) {
                    const t = i / 10;
                    const lx = midX + 40 * Math.sin(t * Math.PI) + (Math.random() - 0.5) * 20;
                    const ly = 80 + t * (H - 230);
                    const size = 6 + Math.random() * 8;
                    ctx.fillStyle = `rgba(255, 150, 0, ${0.15 + Math.sin(gameTime * 0.05 + i) * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(lx, ly, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ============================================================
            // DIBUJAR UNIDADES (estilo LoL)
            // ============================================================
            function drawUnit(unit, isBull) {
                if (!unit.alive) return;
                const s = unit.size;
                const x = unit.x;
                const y = unit.y;

                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;

                // Cuerpo
                const color1 = isBull ? '#6d4c41' : '#4e342e';
                const color2 = isBull ? '#8d6e63' : '#5d4037';
                ctx.fillStyle = color1;
                ctx.beginPath();
                ctx.ellipse(x, y, 12 * s, 17 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = color2;
                ctx.beginPath();
                ctx.ellipse(x, y + 3 * s, 8 * s, 11 * s, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cabeza
                ctx.fillStyle = isBull ? '#5d3a2a' : '#3e2723';
                const headX = isBull ? x + 11 * s : x - 11 * s;
                ctx.beginPath();
                ctx.arc(headX, y - 7 * s, 8 * s, 0, Math.PI * 2);
                ctx.fill();

                // Cuernos / Garras
                if (isBull) {
                    ctx.fillStyle = '#d4a373';
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.moveTo(headX + 4 * s, y - 14 * s);
                    ctx.lineTo(headX + 12 * s, y - 23 * s);
                    ctx.lineTo(headX + 8 * s, y - 16 * s);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(headX - 3 * s, y - 14 * s);
                    ctx.lineTo(headX - 11 * s, y - 23 * s);
                    ctx.lineTo(headX - 7 * s, y - 16 * s);
                    ctx.fill();
                    // Espada
                    ctx.fillStyle = '#b0bec5';
                    ctx.shadowColor = '#ff6d00';
                    ctx.shadowBlur = 8;
                    ctx.fillRect(x + 16 * s, y - 14 * s, 2.5 * s, 20 * s);
                    ctx.fillRect(x + 18 * s, y - 16 * s, 2 * s, 5 * s);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#bdbdbd';
                    ctx.shadowBlur = 5;
                    for (let i = -1; i <= 1; i += 2) {
                        ctx.fillRect(x + i * 12 * s, y + 7 * s, 2.5 * s, 7 * s);
                        ctx.fillRect(x + i * 16 * s, y + 9 * s, 2.5 * s, 7 * s);
                    }
                    // Escudo
                    ctx.fillStyle = '#455a64';
                    ctx.shadowColor = '#2979ff';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(x - 14 * s, y - 2 * s, 9 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#546e7a';
                    ctx.beginPath();
                    ctx.arc(x - 14 * s, y - 2 * s, 6 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Ojos
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(headX + 3 * s, y - 9 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headX - 3 * s, y - 9 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = isBull ? '#4caf50' : '#f44336';
                ctx.beginPath();
                ctx.arc(headX + 3.5 * s, y - 8 * s, 1 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headX - 2.5 * s, y - 8 * s, 1 * s, 0, Math.PI * 2);
                ctx.fill();

                // Efecto ataque
                if (unit.state === 'attack') {
                    ctx.shadowColor = isBull ? '#ff6d00' : '#2979ff';
                    ctx.shadowBlur = 30;
                    ctx.strokeStyle = isBull ? '#ff6d00' : '#2979ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 25 * s, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Barra de vida
                const healthPercent = Math.max(0, unit.health / unit.maxHealth);
                const barW = 32 * s;
                const barH = 4 * s;
                const barX = x - barW / 2;
                const barY = y - 30 * s;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
                const color = healthPercent > 0.5 ? '#4caf50' : healthPercent > 0.25 ? '#ffb347' : '#f44336';
                ctx.fillStyle = color;
                ctx.fillRect(barX, barY, barW * healthPercent, barH);
                ctx.shadowBlur = 0;

                // Nombre
                if (unit.row === 0 && unit.col === 0) {
                    ctx.font = 'bold 7px "Orbitron", sans-serif';
                    ctx.fillStyle = isBull ? 'rgba(76,175,80,0.5)' : 'rgba(244,67,54,0.5)';
                    ctx.textAlign = 'center';
                    ctx.fillText(isBull ? 'TORO' : 'OSO', x, y - 36 * s);
                }
            }

            // ============================================================
            // DIBUJAR PROYECTILES Y PARTÍCULAS
            // ============================================================
            function drawProjectiles() {
                for (const p of projectiles) {
                    for (let t = 0; t < p.trail.length; t++) {
                        const alpha = t / p.trail.length * 0.4;
                        ctx.beginPath();
                        ctx.arc(p.trail[t].x, p.trail[t].y, p.radius * (t / p.trail.length) * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                        ctx.fill();
                    }
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 50;
                    const grad = ctx.createRadialGradient(p.x - 4, p.y - 4, 0, p.x, p.y, p.radius);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, p.color);
                    grad.addColorStop(1, p.color);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    ctx.globalAlpha = p.life;
                    const size = p.radius * (0.3 + 0.7 * p.life);
                    ctx.shadowBlur = p.sparkle ? 30 : 10;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    if (p.sparkle) {
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 5;
                        ctx.beginPath();
                        ctx.arc(p.x - size * 0.3, p.y - size * 0.3, size * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            // ============================================================
            // BUCLE PRINCIPAL
            // ============================================================
            function gameLoop() {
                updateBattle();

                ctx.save();
                ctx.translate(shakeX, shakeY);
                drawMap();
                drawParticles();
                drawProjectiles();

                for (const unit of bullArmy) drawUnit(unit, true);
                for (const unit of bearArmy) drawUnit(unit, false);

                // HUD Superior
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 20;
                ctx.font = 'bold 18px "Orbitron", sans-serif';
                ctx.fillStyle = 'rgba(255,215,0,0.6)';
                ctx.textAlign = 'center';
                ctx.fillText('⚔️ BATALLA BTC ⚔️', W / 2, 32);
                ctx.shadowBlur = 0;

                // Contadores
                const bullAlive = bullArmy.filter(u => u.alive).length;
                const bearAlive = bearArmy.filter(u => u.alive).length;
                ctx.font = 'bold 12px "Orbitron", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#4caf50';
                ctx.fillText(`🐂 ${bullAlive}`, 14, 62);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#f44336';
                ctx.fillText(`${bearAlive} 🐻`, W - 14, 62);

                // Victorias
                ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '8px "Orbitron", sans-serif';
                ctx.fillText(`VICTORIAS: ${bullWins}`, 14, 78);
                ctx.textAlign = 'right';
                ctx.fillText(`${bearWins}`, W - 14, 78);

                ctx.restore();

                requestAnimationFrame(gameLoop);
            }

            // ============================================================
            // INICIALIZAR
            // ============================================================
            async function init() {
                await fetchPrice();
                setInterval(fetchPrice, REFRESH_MS);
                refreshBtn.addEventListener('click', () => {
                    fetchPrice();
                    refreshBtn.style.opacity = '0.6';
                    setTimeout(() => refreshBtn.style.opacity = '1', 200);
                });
                // También intentar cargar al inicio con un pequeño retraso
                setTimeout(fetchPrice, 1000);
                gameLoop();
            }

            init();

            window.addEventListener('beforeunload', () => {});
        })();
    </script>
</body>
</html>
