<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WijTech CCTV Simulator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Toolbar -->
    <header id="toolbar">
        <div class="toolbar-left">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="18" r="16" stroke="#00a8ff" stroke-width="2.5"/>
                    <circle cx="18" cy="18" r="7" fill="#00a8ff" opacity="0.25"/>
                    <circle cx="18" cy="18" r="3.5" fill="#00a8ff"/>
                    <path d="M18 2 L18 9 M18 27 L18 34 M2 18 L9 18 M27 18 L34 18" stroke="#00a8ff" stroke-width="2"/>
                </svg>
                <span>WijTech CCTV</span>
            </div>
            <span class="subtitle">Diseñador profesional de videovigilancia</span>
        </div>
        <div class="toolbar-center">
            <button id="btnAddCamera" class="primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                Añadir
            </button>
            <button id="btnDeleteCamera" class="danger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Eliminar
            </button>
            <button id="btnClearAll">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Limpiar
            </button>
            <button id="btnLoadImage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Fondo
            </button>
            <button id="btnRemoveImage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Quitar
            </button>
            <button id="btnMeasure">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="15 8 19 12 15 16"/><line x1="19" y1="12" x2="19" y2="12"/></svg>
                Medir
            </button>
            <button id="btnSimulate">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Simular
            </button>
            <button id="btnExportImage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar
            </button>
            <button id="btnSaveProject">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Guardar
            </button>
            <button id="btnLoadProject">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Cargar
            </button>
            <button id="btnExample">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Ejemplo
            </button>
        </div>
        <div class="toolbar-right">
            <button id="btnHelp" class="help-btn">?</button>
            <button id="btnFullscreen" class="fullscreen-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div id="app">
        <!-- Left Panel: Camera List -->
        <aside id="camera-panel">
            <div class="panel-header">
                <h3>Cámaras</h3>
                <span class="badge" id="cameraCount">0</span>
            </div>
            <div class="search-box">
                <input type="text" id="cameraSearch" placeholder="Buscar cámara..." />
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <div id="cameraList" class="camera-list"></div>
        </aside>

        <!-- Center: Map Canvas -->
        <main id="map-container">
            <canvas id="mapCanvas"></canvas>
            
            <div id="dropOverlay" class="drop-overlay hidden">
                <div class="drop-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00a8ff" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p>Arrastra tu imagen aquí</p>
                </div>
            </div>

            <div id="calibrationOverlay" class="calibration-overlay hidden">
                <div class="calibration-box">
                    <h3>Calibración de Escala</h3>
                    <p>Línea dibujada: <strong><span id="calibPixels">0</span></strong> píxeles</p>
                    <label>Ingresa la longitud real en metros:</label>
                    <input type="number" id="calibInput" step="0.01" min="0.01" placeholder="Ejemplo: 5.5" />
                    <div class="calib-actions">
                        <button id="calibConfirm" class="primary">Confirmar</button>
                        <button id="calibCancel">Cancelar</button>
                    </div>
                </div>
            </div>

            <div id="tooltip" class="tooltip hidden"></div>
        </main>

        <!-- Right Panel: Properties -->
        <aside id="properties-panel" class="hidden">
            <div class="panel-header">
                <h3>Editar Cámara <span id="camEditNumber">#1</span></h3>
                <button id="closeProperties" class="close-btn">×</button>
            </div>
            <div id="propertiesContent">
                <div class="prop-group">
                    <label>Etiqueta</label>
                    <input type="text" id="propName" placeholder="Nombre de la cámara" />
                </div>
                <div class="prop-group">
                    <label>Modelo de lente</label>
                    <select id="propModel">
                        <option value="2.8mm - 110°">2.8mm - 110°</option>
                        <option value="3.6mm - 87°">3.6mm - 87°</option>
                        <option value="6.0mm - 60°">6.0mm - 60°</option>
                        <option value="12.0mm - 30°">12.0mm - 30°</option>
                        <option value="16.0mm - 20°">16.0mm - 20°</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label>Distancia (metros)</label>
                    <div class="slider-container">
                        <input type="range" id="propDistance" min="0.5" max="50" step="0.1" value="4" />
                        <span id="propDistanceVal" class="slider-value">4.0</span>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Rotación</label>
                    <div class="dial-container">
                        <canvas id="dialCanvas" width="120" height="120"></canvas>
                        <span id="propRotation" class="dial-value">0°</span>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Ángulo de visión (FOV)</label>
                    <div class="slider-container">
                        <input type="range" id="propFov" min="10" max="120" step="1" value="81" />
                        <span id="propFovVal" class="slider-value">81°</span>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Posición en el mapa</label>
                    <div class="pos-display">
                        X: <span id="propPosX">0.00</span>m &nbsp;|&nbsp; Y: <span id="propPosY">0.00</span>m
                    </div>
                </div>
                <div class="prop-actions">
                    <button id="propApply" class="primary">Aplicar cambios</button>
                    <button id="propDelete" class="danger">Eliminar cámara</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Status Bar -->
    <footer id="status-bar">
        <span class="status-item" id="statusScale">📏 Escala: <span id="scaleDisplay">No calibrada</span></span>
        <span class="status-item" id="statusCoords">📍 Posición: (<span id="coordX">0.00</span>, <span id="coordY">0.00</span>)</span>
        <span class="status-item" id="statusCamera">🎥 Cámara: <span id="activeCameraDisplay">Ninguna</span></span>
        <span class="status-item" id="statusMode">Modo: <span id="modeDisplay">Selección</span></span>
        <span class="status-item" id="statusCameras">📷 <span id="totalCameras">0</span> cámaras</span>
    </footer>

    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <input type="file" id="projectInput" accept=".json" style="display:none" />

    <script src="app.js"></script>
</body>
</html>
