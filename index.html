<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla BTC - 3D Realista</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        /* Interfaz de Usuario (HUD) superpuesta al 3D */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Permite hacer clic a través del HUD */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .top-stats {
            text-align: center;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .price {
            font-size: 3rem;
            font-weight: bold;
            color: #00ff88;
        }
        .price.red { color: #ff3355; }
        .subtext {
            font-size: 1rem;
            color: #888;
            margin-top: -5px;
        }
        .sides {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 15%;
            width: 90%;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .bull { color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }
        .bear { color: #ff3355; text-shadow: 0 0 15px rgba(255, 51, 85, 0.5); }
        
        .bottom-feed {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 10px;
            width: 300px;
            border: 1px solid #333;
            pointer-events: auto;
        }
        .feed-item {
            font-size: 0.9rem;
            margin-bottom: 5px;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }
        .green-text { color: #00ff88; }
        .red-text { color: #ff3355; }
        
        /* Gráfico inferior simulado */
        .bottom-chart {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 80px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #333;
            border-radius: 5px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
        }
        .chart-bar {
            flex: 1;
            background: #00ff88;
            margin: 0 1px;
        }
        .chart-bar.bear { background: #ff3355; }
    </style>
    <!-- Importar Three.js desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- HUD (HTML superpuesto) -->
    <div id="hud">
        <div>
            <div class="top-stats">
                <div class="price" id="btcPrice">$64,547.02</div>
                <div class="subtext">+0.08% • 21:48 UTC</div>
            </div>
            <div class="sides">
                <div class="bull">SELL WALL<br><span style="font-size:1.5rem;">$64.0M</span></div>
                <div class="bear">BUY WALL<br><span style="font-size:1.5rem;">$46.9M</span></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="bottom-chart" id="chartContainer"></div>
            
            <div class="bottom-feed">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:#aaa; font-size:0.8rem;">
                    <span>MARKET FEED</span>
                    <span>LIVE</span>
                </div>
                <div class="feed-item"><span class="red-text">● Liquidated short</span> $10K • Bears -5 units</div>
                <div class="feed-item"><span class="green-text">● Large buy trade</span> $200K</div>
                <div class="feed-item"><span class="red-text">● Liquidated short</span> $50K • Bears -14 units</div>
            </div>
        </div>
    </div>

    <!-- Script 3D -->
    <script type="module">
        import * as THREE from 'three';

        // 1. Configuración básica de la escena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a); // Azul oscuro espacial
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.0015); // Niebla para profundidad

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 45); // Cámara isométrica elevada
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Iluminación (Neón y ambiente)
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Luz verde lado Bulls
        const greenLight = new THREE.PointLight(0x00ff88, 200, 80);
        greenLight.position.set(-25, 20, 10);
        scene.add(greenLight);
        // Luz roja lado Bears
        const redLight = new THREE.PointLight(0xff3355, 200, 80);
        redLight.position.set(25, 20, 10);
        scene.add(redLight);

        // Luz central frontal para ver la trinchera
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(0, 30, 30);
        fillLight.castShadow = true;
        scene.add(fillLight);

        // 3. Creación del Terreno (El campo de batalla)
        const terrainWidth = 50;
        const terrainDepth = 40;
        const segments = 64;

        const geometry = new THREE.PlaneGeometry(terrainWidth, terrainDepth, segments, segments);
        geometry.rotateX(-Math.PI / 2);

        // Modificar vértices para crear la trinchera central y ondulaciones
        const positionAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);
            // Crear ondulaciones aleatorias (colinas)
            const xOffset = Math.sin(vertex.x * 0.5) * Math.cos(vertex.z * 0.5) * 1.5;
            // Trinchera central: si x está cerca de 0, baja el terreno
            const trenchOffset = -Math.exp(-Math.pow(vertex.x, 2) * 0.2) * 1.5; 
            vertex.y = xOffset + trenchOffset;
            positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        geometry.computeVertexNormals();

        // Materiales divididos: Izquierda Verde (Bulls), Derecha Roja (Bears)
        // Usamos un truco de UVs o vértices para colorear. Aquí crearemos dos mallas.
        
        // Función para crear medio terreno
        function createHalfTerrain(xPos, color, lightColor) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.8,
                metalness: 0.1,
                emissive: lightColor,
                emissiveIntensity: 0.05,
                side: THREE.DoubleSide
            });
            // Clonamos la geometría para no compartirla (o recortamos), pero para simplificar usaremos la misma y la posicionaremos.
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.x = xPos;
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            return mesh;
        }

        // Green side (Bulls) desplazado a la izquierda
        const greenTerrain = createHalfTerrain(-12.5, 0x1a3c1a, 0x00ff88);
        // Red side (Bears) desplazado a la derecha
        const redTerrain = createHalfTerrain(12.5, 0x3c1a1a, 0xff3355);
        
        // Truco visual: La trinchera es el hueco entre ambos.
        scene.add(greenTerrain);
        scene.add(redTerrain);

        // 4. Sistema de Partículas (Lluvia / Datos cayendo)
        const particleCount = 1500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 200;
            particlePos[i+1] = Math.random() * 80;
            particlePos[i+2] = (Math.random() - 0.5) * 200;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.15,
            transparent: true,
            opacity: 0.6
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // 5. Ejércitos y Batalla (Esferas que se mueven)
        const armyGroup = new THREE.Group();
        scene.add(armyGroup);

        // Creamos "soldados" (esferas verdes y rojas)
        const greenArmy = [];
        const redArmy = [];
        const armySize = 40;

        // Materiales brillantes
        const greenMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.3 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0xff3355, emissiveIntensity: 0.3 });
        const sphereGeo = new THREE.SphereGeometry(0.6, 8, 8);

        for(let i=0; i<armySize; i++) {
            // Soldado Verde
            const gSphere = new THREE.Mesh(sphereGeo, greenMat);
            gSphere.position.set(-8 + Math.random()*4, 0.5, -15 + Math.random()*20);
            gSphere.castShadow = true;
            armyGroup.add(gSphere);
            greenArmy.push({ mesh: gSphere, speed: 0.5 + Math.random()*0.2, offset: Math.random()*10 });

            // Soldado Rojo
            const rSphere = new THREE.Mesh(sphereGeo, redMat);
            rSphere.position.set(8 - Math.random()*4, 0.5, -15 + Math.random()*20);
            rSphere.castShadow = true;
            armyGroup.add(rSphere);
            redArmy.push({ mesh: rSphere, speed: 0.5 + Math.random()*0.2, offset: Math.random()*10 });
        }

        // 6. Animación y Lógica del Precio (Simulación)
        let currentPrice = 64547.02;
        const priceElement = document.getElementById('btcPrice');
        const chartContainer = document.getElementById('chartContainer');
        let chartBars = [];

        function updatePrice() {
            // Simular volatilidad
            const change = (Math.random() - 0.5) * 50;
            currentPrice += change;
            
            // Actualizar HTML
            priceElement.textContent = `$${currentPrice.toFixed(2)}`;
            if(change > 0) {
                priceElement.className = 'price';
            } else {
                priceElement.className = 'price red';
            }

            // Actualizar gráfico de barras (simulación visual)
            const bar = document.createElement('div');
            bar.className = 'chart-bar';
            if(change < 0) bar.classList.add('bear');
            bar.style.height = `${Math.random() * 100}%`;
            chartContainer.appendChild(bar);
            
            if(chartContainer.children.length > 30) {
                chartContainer.removeChild(chartContainer.firstChild);
            }
        }
        setInterval(updatePrice, 500);

        // 7. Bucle de Juego (Animación)
        function animate() {
            requestAnimationFrame(animate);

            // Mover partículas (lluvia)
            const positions = particles.geometry.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                positions[i] -= 0.3; // Caer
                if(positions[i] < -10) positions[i] = 80; // Resetear arriba
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Mover ejércitos hacia el centro (la trinchera)
            // Simular que el precio empuja a un lado
            const pushFactor = (currentPrice - 64547) / 100; // Cuanto más sube, más empujan los verdes
            
            greenArmy.forEach((unit, index) => {
                // Movimiento hacia el centro (+ un poco de ruido)
                unit.mesh.position.x += 0.05 + (pushFactor * 0.01);
                if(unit.mesh.position.x > 0.5) unit.mesh.position.x = 0.5; // Límite de la trinchera
                // Movimiento ondulante en Z
                unit.mesh.position.z += Math.sin(Date.now() * 0.001 + unit.offset) * 0.02;
            });

            redArmy.forEach((unit, index) => {
                // Movimiento hacia el centro (- un poco de ruido)
                unit.mesh.position.x -= 0.05 - (pushFactor * 0.01);
                if(unit.mesh.position.x < -0.5) unit.mesh.position.x = -0.5; // Límite de la trinchera
                unit.mesh.position.z += Math.sin(Date.now() * 0.001 + unit.offset + 1) * 0.02;
            });

            // Rotar cámara suavemente o mantenerla fija. Aquí la dejamos fija.
            renderer.render(scene, camera);
        }

        animate();

        // Manejar redimensionado de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
