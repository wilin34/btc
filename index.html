<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC War - Tanques y Dispersión</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        .top-left { position: absolute; top: 20px; left: 20px; text-align: left; }
        .top-right { position: absolute; top: 20px; right: 20px; text-align: right; }
        
        .price { font-size: 3.5rem; font-weight: bold; transition: color 0.5s ease; text-shadow: 0 0 30px rgba(0,0,0,0.9); }
        .price.green { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.6); }
        .price.red { color: #ff3355; text-shadow: 0 0 20px rgba(255, 51, 85, 0.6); }
        .subtext { font-size: 0.9rem; color: #888; margin-top: -5px; }
        
        .sides { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; }
        .bull { color: #00ff88; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
        .bear { color: #ff3355; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 51, 85, 0.5); }
        
        .status-badge { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.85); padding: 10px 30px; border-radius: 30px; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            border: 1px solid #555; transition: all 0.8s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        
        .dominance-bar-container {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 500px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px;
            overflow: hidden;
        }
        .dominance-bar {
            height: 100%; width: 50%; background: #888; transition: width 0.5s ease, background 0.5s ease;
            border-radius: 10px;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="hud">
        <div class="top-left">
            <div class="bull">🏛️ BULLS HQ</div>
            <div class="price green" id="btcPrice">Cargando...</div>
            <div class="subtext" id="btcChange">--%</div>
        </div>
        <div class="top-right">
            <div class="bear">🐻 BEARS HQ</div>
        </div>

        <div class="status-badge" id="statusText">⚔️ EQUILIBRIO</div>
        
        <div class="dominance-bar-container">
            <div class="dominance-bar" id="dominanceBar"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. CONFIGURACIÓN DE ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 55);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        sunLight.position.set(-30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        scene.add(sunLight);

        // Luces de los bandos
        const greenLight = new THREE.PointLight(0x00ff88, 80, 50);
        greenLight.position.set(-25, 15, 0);
        scene.add(greenLight);
        const redLight = new THREE.PointLight(0xff3355, 80, 50);
        redLight.position.set(25, 15, 0);
        scene.add(redLight);

        // --- 2. TERRENO SUAVE ---
        const terrainWidth = 70;
        const terrainDepth = 50;
        const segments = 100;
        const geometry = new THREE.PlaneGeometry(terrainWidth, terrainDepth, segments, segments);
        geometry.rotateX(-Math.PI / 2);

        const positionAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);
            const y = Math.sin(vertex.x * 0.15) * Math.cos(vertex.z * 0.2) * 0.8 
                    + Math.sin(vertex.x * 0.1 + vertex.z * 0.1) * 0.4
                    - Math.exp(-Math.pow(vertex.x, 2) * 0.03) * 0.8;
            positionAttribute.setY(i, y);
        }
        geometry.computeVertexNormals();

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a3c1a';
            ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i=10000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#2a5c2a' : '#1a4a1a';
                ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1 + Math.random()*2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const grassTexture = createGrassTexture();
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(10, 10);

        const material = new THREE.MeshStandardMaterial({
            map: grassTexture,
            roughness: 0.9,
            metalness: 0.0,
            vertexColors: true,
            side: THREE.DoubleSide
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        function updateTerrainColors(dominance) {
            const colors = new Float32Array(positionAttribute.count * 3);
            const color = new THREE.Color();
            let frontLineX = dominance * 6; 

            for (let i = 0; i < positionAttribute.count; i++) {
                vertex.fromBufferAttribute(positionAttribute, i);
                const x = vertex.x;
                const t = (x - (frontLineX - 8)) / 16;
                const clampedT = Math.max(0, Math.min(1, t));
                const hue = 0.33 - (clampedT * 0.33); 
                color.setHSL(hue, 0.7, 0.12 + (clampedT * 0.25));
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.attributes.color.needsUpdate = true;
        }

        // --- 3. BASES MILITARES Y ÁRBOLES ---
        function createBase(x, z, teamColor) {
            const group = new THREE.Group();
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0.1;
            floor.receiveShadow = true;
            group.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.8 });
            for(let i=0; i<4; i++) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(7, 2.5, 0.5), wallMat);
                wall.position.set( Math.sin(i*Math.PI/2)*3.5, 1.25, Math.cos(i*Math.PI/2)*3.5 );
                wall.castShadow = true;
                group.add(wall);
            }

            const comMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.6 });
            const center = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 2.5, 8), comMat);
            center.position.y = 1.25;
            center.castShadow = true;
            group.add(center);

            const poleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3), poleMat);
            pole.position.set(0, 1.5, 3.5);
            group.add(pole);

            const flagMat = new THREE.MeshStandardMaterial({ color: teamColor });
            const flag = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.6), flagMat);
            flag.position.set(0.5, 3, 3.5);
            flag.rotation.y = -Math.PI/4;
            group.add(flag);

            const y = Math.sin(x * 0.15) * Math.cos(z * 0.2) * 0.8 + Math.sin(x * 0.1 + z * 0.1) * 0.4;
            group.position.set(x, y, z);
            return group;
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({color: 0x4a3b32, roughness: 0.9});
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.3, 1.5), trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({color: 0x1a5a1a, roughness: 0.8});
            const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2, 6), leafMat);
            leaf1.position.y = 1.8;
            leaf1.castShadow = true;
            group.add(leaf1);

            const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 6), leafMat);
            leaf2.position.y = 2.8;
            leaf2.castShadow = true;
            group.add(leaf2);

            const y = Math.sin(x * 0.15) * Math.cos(z * 0.2) * 0.8 + Math.sin(x * 0.1 + z * 0.1) * 0.4;
            group.position.set(x, y, z);
            return group;
        }

        // Añadir bases y árboles
        scene.add(createBase(-28, 0, 0x00ff88));
        scene.add(createBase(28, 0, 0xff3355));

        for(let i=0; i<200; i++) {
            let x = (Math.random() - 0.5) * 65;
            let z = (Math.random() - 0.5) * 45;
            if(Math.abs(x) < 12 || Math.abs(x) > 26) continue; // Zona de batalla y bases libres
            if(Math.abs(z) < 3) continue;
            scene.add(createTree(x, z));
        }

        // --- 4. SOLDADOS CON DISPERSIÓN ---
        function create3DSoldier(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.6, 6), mat);
            torso.position.y = 0.7;
            torso.castShadow = true;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), darkMat);
            head.position.y = 1.1;
            head.castShadow = true;
            group.add(head);
            
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.25), new THREE.MeshStandardMaterial({color: 0x00aaff, emissive: 0x00aaff, emissiveIntensity: 0.5}));
            visor.position.set(0, 1.05, 0.2);
            group.add(visor);

            const armMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 4);
            
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.3, 0.7, 0);
            armL.rotation.z = 0.3;
            armL.castShadow = true;
            group.add(armL);

            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.3, 0.7, 0);
            armR.rotation.z = -0.3;
            armR.castShadow = true;
            group.add(armR);

            const legMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 });
            const legGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.5, 4);
            
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.15, 0.25, 0);
            legL.castShadow = true;
            group.add(legL);

            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.15, 0.25, 0);
            legR.castShadow = true;
            group.add(legR);

            const rifleMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5, roughness: 0.4 });
            const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 0.08), rifleMat);
            rifle.position.set(0.5, 0.7, 0);
            rifle.rotation.z = -0.1;
            group.add(rifle);

            return group;
        }

        class Soldier {
            constructor(x, z, team) {
                this.team = team;
                this.alive = true;
                this.hp = 100;
                
                const color = team === 'green' ? 0x00ff88 : 0xff3355;
                this.mesh = create3DSoldier(color);
                const y = Math.sin(x * 0.15) * Math.cos(z * 0.2) * 0.8 + Math.sin(x * 0.1 + z * 0.1) * 0.4;
                this.mesh.position.set(x, y, z);
                
                if(team === 'green') this.mesh.rotation.y = 0;
                else this.mesh.rotation.y = Math.PI;

                scene.add(this.mesh);
                
                // Lógica de dispersión
                this.speed = 0.02 + Math.random() * 0.02;
                this.zBoundary = 20; 
                this.initialZ = z;
                this.targetZ = z;
                this.targetX = x;
                this.timeToChangeTarget = 0;
            }

            update(pushStrength, time) {
                if(!this.alive) return;

                // Cambiar objetivo aleatoriamente para dispersarse
                this.timeToChangeTarget -= 0.01;
                if(this.timeToChangeTarget <= 0) {
                    // El soldado elige un punto aleatorio hacia adelante y a los lados
                    const forward = this.team === 'green' ? 2 : -2;
                    this.targetX = this.mesh.position.x + forward + (Math.random() - 0.5) * 3;
                    this.targetZ = this.mesh.position.z + (Math.random() - 0.5) * 5;
                    // Limitar el objetivo dentro del campo
                    this.targetZ = Math.max(-this.zBoundary, Math.min(this.zBoundary, this.targetZ));
                    this.timeToChangeTarget = 0.5 + Math.random() * 1.0;
                }

                // Movimiento suave hacia el objetivo (dispersión)
                const dx = this.targetX - this.mesh.position.x;
                const dz = this.targetZ - this.mesh.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);

                if(dist > 0.1) {
                    const moveSpeed = Math.min(this.speed, dist);
                    // Empuje del mercado + movimiento táctico
                    const marketPush = this.team === 'green' ? pushStrength * 0.02 : -pushStrength * 0.02;
                    this.mesh.position.x += (dx / dist) * moveSpeed + marketPush;
                    this.mesh.position.z += (dz / dist) * moveSpeed;
                }

                // Limitar el borde del mapa en Z
                if (this.mesh.position.z > this.zBoundary) this.mesh.position.z = this.zBoundary - 0.5;
                if (this.mesh.position.z < -this.zBoundary) this.mesh.position.z = -this.zBoundary + 0.5;
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                if(this.hp <= 0) {
                    this.alive = false;
                    scene.remove(this.mesh);
                    createExplosion(this.mesh.position.x, this.mesh.position.y + 1, this.mesh.position.z, this.team, 1);
                    return true;
                }
                return false;
            }

            respawn(x, z) {
                this.alive = true;
                this.hp = 100;
                const y = Math.sin(x * 0.15) * Math.cos(z * 0.2) * 0.8 + Math.sin(x * 0.1 + z * 0.1) * 0.4;
                this.mesh.position.set(x, y, z);
                scene.add(this.mesh);
                this.targetX = x;
                this.targetZ = z;
                this.timeToChangeTarget = 1.0;
            }
        }

        // --- 5. TANQUES DE GUERRA ---
        function createTank(color) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.8, metalness: 0.3 });
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const teamMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.5 });

            // Chasis
            const hull = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 1.5), bodyMat);
            hull.position.y = 0.6;
            hull.castShadow = true;
            group.add(hull);

            // Orugas
            const trackGeo = new THREE.BoxGeometry(0.3, 0.5, 2);
            const trackL = new THREE.Mesh(trackGeo, trackMat);
            trackL.position.set(-1.4, 0.5, 0);
            group.add(trackL);
            const trackR = new THREE.Mesh(trackGeo, trackMat);
            trackR.position.set(1.4, 0.5, 0);
            group.add(trackR);

            // Torreta
            const turret = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.6, 8), teamMat);
            turret.position.y = 1.2;
            turret.castShadow = true;
            group.add(turret);

            // Cañón
            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 1.2, 6), teamMat);
            cannon.position.set(0, 1.2, 1.2);
            cannon.rotation.x = Math.PI / 2;
            cannon.castShadow = true;
            group.add(cannon);

            return group;
        }

        class Tank {
            constructor(x, z, team) {
                this.team = team;
                this.alive = true;
                this.hp = 500;
                this.cooldown = 0;
                
                const color = team === 'green' ? 0x00ff88 : 0xff3355;
                this.mesh = createTank(color);
                const y = Math.sin(x * 0.15) * Math.cos(z * 0.2) * 0.8 + Math.sin(x * 0.1 + z * 0.1) * 0.4;
                this.mesh.position.set(x, y, z);
                if(team === 'green') this.mesh.rotation.y = 0;
                else this.mesh.rotation.y = Math.PI;
                scene.add(this.mesh);

                this.speed = 0.01;
                this.zBoundary = 18;
                this.targetZ = z;
                this.timeToChangeTarget = 0;
            }

            update(pushStrength, time) {
                if(!this.alive) return;

                // Movimiento lento del tanque
                const marketPush = this.team === 'green' ? pushStrength * 0.01 : -pushStrength * 0.01;
                this.mesh.position.x += this.speed + marketPush;

                // Dispersión lateral de tanques
                this.timeToChangeTarget -= 0.01;
                if(this.timeToChangeTarget <= 0) {
                    this.targetZ = this.mesh.position.z + (Math.random() - 0.5) * 4;
                    this.targetZ = Math.max(-this.zBoundary, Math.min(this.zBoundary, this.targetZ));
                    this.timeToChangeTarget = 2 + Math.random() * 2;
                }
                const dz = this.targetZ - this.mesh.position.z;
                if(Math.abs(dz) > 0.1) this.mesh.position.z += Math.sign(dz) * 0.02;

                // Disparar
                this.cooldown -= 0.01;
                if(this.cooldown <= 0 && this.alive) {
                    this.shoot();
                    this.cooldown = 1.5 + Math.random() * 1.0;
                }

                // Límites
                if(this.mesh.position.x > 8 && this.team === 'green') this.mesh.position.x = 8;
                if(this.mesh.position.x < -8 && this.team === 'red') this.mesh.position.x = -8;
            }

            shoot() {
                // Crear un proyectil
                const startX = this.mesh.position.x + (this.team === 'green' ? 1.5 : -1.5);
                const y = Math.sin(startX * 0.15) * Math.cos(this.mesh.position.z * 0.2) * 0.8 + Math.sin(startX * 0.1 + this.mesh.position.z * 0.1) * 0.4 + 1.5;
                createProjectile(startX, y, this.mesh.position.z, this.team);
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                if(this.hp <= 0) {
                    this.alive = false;
                    scene.remove(this.mesh);
                    createExplosion(this.mesh.position.x, this.mesh.position.y + 2, this.mesh.position.z, this.team, 3);
                }
            }
        }

        // --- 6. PROYECTILES DE TANQUES ---
        const projectiles = [];

        function createProjectile(x, y, z, team) {
            const geo = new THREE.SphereGeometry(0.2, 6, 6);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500, emissiveIntensity: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            const direction = team === 'green' ? 1 : -1;
            projectiles.push({
                mesh: mesh,
                vx: 0.3 * direction + (Math.random() - 0.5) * 0.05,
                vy: (Math.random() - 0.5) * 0.05,
                vz: (Math.random() - 0.5) * 0.05,
                team: team,
                life: 3.0
            });
        }

        // --- 7. EXPLOSIONES MEJORADAS ---
        const explosions = [];
        function createExplosion(x, y, z, teamColor, size) {
            const count = 80 * size;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const velocities = [];
            const baseColor = teamColor === 'green' ? [0, 1, 0.5] : [1, 0.2, 0.3];

            for(let i=0; i<count; i++) {
                positions[i*3] = x + (Math.random()-0.5)*2*size;
                positions[i*3+1] = y;
                positions[i*3+2] = z + (Math.random()-0.5)*2*size;
                
                const r = Math.random();
                if(r < 0.6) { colors[i*3] = 1; colors[i*3+1] = 0.6; colors[i*3+2] = 0; } // Fuego
                else if(r < 0.8) { colors[i*3] = 1; colors[i*3+1] = 1; colors[i*3+2] = 1; } // Humo
                else { colors[i*3] = baseColor[0]; colors[i*3+1] = baseColor[1]; colors[i*3+2] = baseColor[2]; } // Bando

                velocities.push({
                    x: (Math.random() - 0.5) * 5 * size,
                    y: Math.random() * 6 * size + 2,
                    z: (Math.random() - 0.5) * 5 * size
                });
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.4 * size,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            explosions.push({ mesh: points, velocities: velocities, life: 1.5, decay: 0.015 });
        }

        // --- 8. EJÉRCITOS Y TANQUES ---
        let greenArmy = [];
        let redArmy = [];
        let greenTanks = [];
        let redTanks = [];
        let maxTotalArmy = 120;

        function spawnSoldier(team) {
            const z = (Math.random() - 0.5) * 30;
            let x;
            if(team === 'green') x = -18 - Math.random()*3;
            else x = 18 + Math.random()*3;
            const soldier = new Soldier(x, z, team);
            if(team === 'green') greenArmy.push(soldier);
            else redArmy.push(soldier);
        }

        function spawnTank(team) {
            const z = (Math.random() - 0.5) * 25;
            let x;
            if(team === 'green') x = -20 - Math.random()*2;
            else x = 20 + Math.random()*2;
            const tank = new Tank(x, z, team);
            if(team === 'green') greenTanks.push(tank);
            else redTanks.push(tank);
        }

        // Inicializar
        for(let i=0; i<50; i++) spawnSoldier('green');
        for(let i=0; i<50; i++) spawnSoldier('red');
        for(let i=0; i<5; i++) spawnTank('green');
        for(let i=0; i<5; i++) spawnTank('red');

        function updateArmySize(greenTarget, redTarget) {
            const greenCurrent = greenArmy.filter(s => s.alive).length;
            const redCurrent = redArmy.filter(s => s.alive).length;

            // Refuerzos para Verdes
            if(greenCurrent < greenTarget) {
                const deadGreen = greenArmy.find(s => !s.alive);
                if(deadGreen) deadGreen.respawn(-18 - Math.random()*3, (Math.random() - 0.5) * 30);
                else if(greenArmy.length + redArmy.length < maxTotalArmy) spawnSoldier('green');
            } 
            else if (greenCurrent > greenTarget) {
                const aliveGreens = greenArmy.filter(s => s.alive);
                if(aliveGreens.length > 0) {
                    const randomGreen = aliveGreens[Math.floor(Math.random() * aliveGreens.length)];
                    randomGreen.alive = false;
                    scene.remove(randomGreen.mesh);
                }
            }

            // Refuerzos para Rojos
            if(redCurrent < redTarget) {
                const deadRed = redArmy.find(s => !s.alive);
                if(deadRed) deadRed.respawn(18 + Math.random()*3, (Math.random() - 0.5) * 30);
                else if(greenArmy.length + redArmy.length < maxTotalArmy) spawnSoldier('red');
            } else if (redCurrent > redTarget) {
                const aliveReds = redArmy.filter(s => s.alive);
                if(aliveReds.length > 0) {
                    const randomRed = aliveReds[Math.floor(Math.random() * aliveReds.length)];
                    randomRed.alive = false;
                    scene.remove(randomRed.mesh);
                }
            }
        }

        // --- 9. PRECIO REAL ---
        let currentPrice = 64000;
        let dominance = 0;
        const priceElement = document.getElementById('btcPrice');
        const changeElement = document.getElementById('btcChange');
        const statusElement = document.getElementById('statusText');
        const dominanceBar = document.getElementById('dominanceBar');

        async function fetchBTCPrice() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT');
                const data = await response.json();
                currentPrice = parseFloat(data.lastPrice);
                const change = parseFloat(data.priceChangePercent);

                priceElement.textContent = `$${currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                priceElement.className = `price ${change > 0 ? 'green' : 'red'}`;
                changeElement.textContent = `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;

                dominance = Math.max(-1, Math.min(1, change / 2)); 
                
                // Calcular ejército basado en % de cambio
                const baseArmy = 30; 
                const maxExtra = 40;
                const greenExtra = Math.min(maxExtra, Math.max(0, change * 8)); 
                const redExtra = Math.min(maxExtra, Math.max(0, -change * 8));
                updateArmySize(baseArmy + greenExtra, baseArmy + redExtra);

                // Actualizar terreno y barra
                updateTerrainColors(dominance);
                const barPercent = 50 + (dominance * 50);
                dominanceBar.style.width = `${Math.max(0, Math.min(100, barPercent))}%`;
                dominanceBar.style.background = dominance > 0.1 ? '#00ff88' : dominance < -0.1 ? '#ff3355' : '#888';

                if(dominance > 0.3) {
                    statusElement.innerHTML = '🔥 OFENSIVA BULL';
                    statusElement.style.color = '#00ff88';
                    statusElement.style.borderColor = '#00ff88';
                } else if (dominance < -0.3) {
                    statusElement.innerHTML = '🔥 OFENSIVA BEAR';
                    statusElement.style.color = '#ff3355';
                    statusElement.style.borderColor = '#ff3355';
                } else {
                    statusElement.innerHTML = '⚔️ EQUILIBRIO';
                    statusElement.style.color = '#aaa';
                    statusElement.style.borderColor = '#555';
                }

            } catch (error) {
                console.error("API Error:", error);
            }
        }
        fetchBTCPrice();
        setInterval(fetchBTCPrice, 3000);

        // --- 10. COMBATE Y FÍSICA ---
        function checkCollisions() {
            const limit = 1.5;
            for(let g of greenArmy) {
                if(!g.alive) continue;
                for(let r of redArmy) {
                    if(!r.alive) continue;
                    const dx = g.mesh.position.x - r.mesh.position.x;
                    const dz = g.mesh.position.z - r.mesh.position.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if(dist < limit) {
                        g.takeDamage(20);
                        r.takeDamage(20);
                    }
                }
            }
        }

        // --- 11. BUCLE PRINCIPAL ---
        let time = 0;
        
        const rainCount = 3000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount*3; i+=3) {
            rainPos[i] = (Math.random()-0.5)*150;
            rainPos[i+1] = Math.random()*80;
            rainPos[i+2] = (Math.random()-0.5)*150;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({color: 0x88aaff, size: 0.15, transparent: true, opacity: 0.3});
        const rain = new THREE.Points(rainGeo, rainMat);
        scene.add(rain);

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Lluvia
            const rPos = rain.geometry.attributes.position.array;
            for(let i=1; i<rPos.length; i+=3) {
                rPos[i] -= 0.8;
                if(rPos[i] < -10) rPos[i] = 80;
            }
            rain.geometry.attributes.position.needsUpdate = true;

            // Actualizar entidades
            const pushStrength = dominance * 0.6;
            greenArmy.forEach(g => g.update(pushStrength, time));
            redArmy.forEach(r => r.update(pushStrength, time));
            greenTanks.forEach(t => t.update(pushStrength, time));
            redTanks.forEach(t => t.update(pushStrength, time));

            checkCollisions();

            // Actualizar proyectiles
            for(let i=projectiles.length-1; i>=0; i--) {
                const p = projectiles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.mesh.position.z += p.vz;
                p.vy -= 0.005; // Gravedad
                p.life -= 0.02;
                
                if(p.life <= 0 || p.mesh.position.y < 0) {
                    // Impacto
                    createExplosion(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, p.team, 2);
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            // Actualizar explosiones
            for(let i=explosions.length-1; i>=0; i--) {
                const exp = explosions[i];
                exp.life -= exp.decay;
                const pos = exp.mesh.geometry.attributes.position.array;
                for(let j=0; j<pos.length; j+=3) {
                    pos[j] += exp.velocities[j/3].x * 0.2;
                    pos[j+1] += exp.velocities[j/3].y * 0.2;
                    pos[j+2] += exp.velocities[j/3].z * 0.2;
                    exp.velocities[j/3].y -= 0.05;
                }
                exp.mesh.geometry.attributes.position.needsUpdate = true;
                exp.mesh.material.opacity = exp.life;
                if(exp.life <= 0) {
                    scene.remove(exp.mesh);
                    explosions.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Inicialización
        updateTerrainColors(0);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
